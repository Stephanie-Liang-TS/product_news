[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "product-news"
version = "0.1.0"
description = "Lightweight desktop widget for product news notifications."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "APScheduler>=3.10.4",
  "feedparser>=6.0.11",
  "platformdirs>=4.2.2",
  "PySide6>=6.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.5.0",
]
build = [
  "pyinstaller>=6.8.0",
]

[project.scripts]
product-news = "product_news.app.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/product_news"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
