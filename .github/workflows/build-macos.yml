name: Build macOS App

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            artifact: product-news-macos-intel
          - os: macos-14
            artifact: product-news-macos-apple-silicon

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e ".[dev,build]"

      - name: Prepare macOS icon
        run: |
          mkdir -p build/app.iconset
          for size in 16 32 64 128 256 512; do
            sips -z "$size" "$size" src/product_news/assets/product_meow_icon.png --out "build/app.iconset/icon_${size}x${size}.png"
          done
          sips -z 32 32 src/product_news/assets/product_meow_icon.png --out build/app.iconset/icon_16x16@2x.png
          sips -z 64 64 src/product_news/assets/product_meow_icon.png --out build/app.iconset/icon_32x32@2x.png
          sips -z 256 256 src/product_news/assets/product_meow_icon.png --out build/app.iconset/icon_128x128@2x.png
          sips -z 512 512 src/product_news/assets/product_meow_icon.png --out build/app.iconset/icon_256x256@2x.png
          sips -z 1024 1024 src/product_news/assets/product_meow_icon.png --out build/app.iconset/icon_512x512@2x.png
          iconutil -c icns build/app.iconset -o build/product-news.icns

      - name: Build app bundle
        run: |
          pyinstaller --noconfirm --clean --windowed --collect-all PySide6 --add-data "src/product_news/assets:product_news/assets" --paths src --icon build/product-news.icns --name "Product News" src/product_news/__main__.py

      - name: Prepare package
        run: |
          mkdir -p package
          cp -R "dist/Product News.app" package/
          cp .env.example package/.env.example
          cp USER_INSTALL.md package/USER_INSTALL.md
          ditto -c -k --sequesterRsrc --keepParent package "${{ matrix.artifact }}.zip"

      - name: Prepare drag-to-Applications DMG
        run: |
          mkdir -p dmg-root
          cp -R "dist/Product News.app" dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create \
            -volname "Product News" \
            -srcfolder dmg-root \
            -ov \
            -format UDZO \
            "${{ matrix.artifact }}.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.dmg

      - name: Create release assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.dmg
