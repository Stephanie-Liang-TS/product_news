name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,build]"

      - name: Build exe
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --collect-all PySide6 --paths src --name product-news src/product_news/__main__.py

      - name: Copy env example
        run: |
          copy .env.example dist\.env.example
          copy USER_INSTALL.md dist\USER_INSTALL.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: product-news-windows
          path: |
            dist/product-news.exe
            dist/.env.example
            dist/USER_INSTALL.md

      - name: Create release assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/product-news.exe
            dist/.env.example
            dist/USER_INSTALL.md
